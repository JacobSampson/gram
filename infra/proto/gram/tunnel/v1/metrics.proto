syntax = "proto3";
package gram.tunnel.v1;
import "gcp/pubsub/v1/options.proto";
option go_package = "github.com/speakeasy-api/gram/infra/gen/gram/tunnel/v1;tunnelv1";

// Cumulative aggregate for one source/producer/bucket/dimension tuple.
// No arbitrary attributes, URLs, headers, tool names, arguments or results.
message MetricsSnapshot {
  option (gcp.pubsub.v1.topic) = {retention_hint: {seconds: 604800}};
  string source_id = 1;
  string producer_id = 2;
  int64 bucket_unix = 3;
  uint64 revision = 4;
  string kind = 5;
  string server_id = 6;
  string method = 7;
  string client_family = 8;
  uint64 attempts = 9;
  uint64 successes = 10;
  uint64 errors = 11;
  uint64 canceled = 12;
  uint64 incomplete = 13;
  repeated uint64 latency_bins = 14;
  uint32 connections = 15;
  uint32 consumers = 16;
  uint32 substreams = 17;
  uint32 diagnostics_available = 18;
  uint32 targets_unreachable = 19;
  uint64 connections_opened = 20;
}
